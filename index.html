<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Recarga</title>
    <!-- Tus estilos y librerías habituales -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Estilos base limpios y adaptados a tu estructura original */
        :root {
            --primary: #2563eb;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--card); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.25rem; font-weight: 700; color: var(--text); }
        .admin-link { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
        .admin-link:hover { color: var(--text); }
        
        .filters { display: flex; justify-content: center; gap: 10px; padding: 1.5rem; flex-wrap: wrap; }
        .filter-btn { background: var(--card); color: var(--text-muted); border: 1px solid var(--border); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 500; }
        .filter-btn.active, .filter-btn:hover { background: var(--primary); color: #fff; border-color: var(--primary); }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 1rem 2rem 1rem; flex: 1; width: 100%; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1.25rem; }
        
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 1.25rem; }
        .card h3 { font-size: 1rem; margin-bottom: 0.5rem; }
        .card p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1rem; }
        .btn-comprar { background: var(--primary); color: #fff; border: none; padding: 8px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; }
        .btn-comprar:hover { opacity: 0.9; }

        /* Modal Original */
        #modalCompra { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 1rem; }
        .modal-content { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: 100%; max-width: 450px; padding: 1.5rem; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .close-btn { background: none; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; }
        
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 4px; color: var(--text-muted); }
        .form-group select, .form-group input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: #0f172a; color: var(--text); font-size: 0.85rem; }

        .resumen-pago { background: rgba(15, 23, 42, 0.4); border: 1px solid var(--border); padding: 10px; border-radius: 6px; margin-bottom: 1rem; font-size: 0.8rem; }
        .resumen-pago div { display: flex; justify-content: space-between; margin-bottom: 4px; }
        .resumen-pago .total { font-weight: 700; color: var(--primary); border-top: 1px solid var(--border); padding-top: 4px; margin-top: 4px; }

        footer { background: var(--card); border-top: 1px solid var(--border); text-align: center; padding: 1rem; font-size: 0.8rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <header>
        <div class="logo">PC Recarga</div>
        <a href="admin.html" class="admin-link"><i class="fa-solid fa-lock"></i> Admin</a>
    </header>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">Todos</button>
        <button class="filter-btn" data-filter="juegos">Videojuegos</button>
        <button class="filter-btn" data-filter="streaming">Streaming</button>
    </div>

    <div class="container">
        <div class="grid">
            
            <!-- Free Fire -->
            <div class="card" data-category="juegos">
                <div>
                    <h3>Free Fire</h3>
                    <p>Recarga diamantes directos a tu ID.</p>
                </div>
                <button class="btn-comprar" onclick="abrirModal('Free Fire', [{nombre: '100 Diamantes', precio: 1.00}, {nombre: '310 Diamantes', precio: 3.10}, {nombre: '520 Diamantes', precio: 5.00}])">Recargar</button>
            </div>

            <!-- Roblox -->
            <div class="card" data-category="juegos">
                <div>
                    <h3>Roblox</h3>
                    <p>Obtén Robux de forma segura.</p>
                </div>
                <button class="btn-comprar" onclick="abrirModal('Roblox', [{nombre: '400 Robux', precio: 5.00}, {nombre: '800 Robux', precio: 10.00}])">Recargar</button>
            </div>

            <!-- Mobile Legends -->
            <div class="card" data-category="juegos">
                <div>
                    <h3>Mobile Legends</h3>
                    <p>Diamantes con ID y Zona.</p>
                </div>
                <button class="btn-comprar" onclick="abrirModal('Mobile Legends', [{nombre: '112 Diamantes', precio: 2.00}, {nombre: '224 Diamantes', precio: 4.00}])">Recargar</button>
            </div>

            <!-- Netflix -->
            <div class="card" data-category="streaming">
                <div>
                    <h3>Netflix</h3>
                    <p>Cuentas de streaming digitales.</p>
                </div>
                <button class="btn-comprar" onclick="abrirModal('Netflix', [{nombre: '1 Pantalla (1 Mes)', precio: 4.00}])">Comprar</button>
            </div>

        </div>
    </div>

    <!-- Modal -->
    <div id="modalCompra">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitulo" style="font-size: 1rem; color: var(--primary);">Recargar</h3>
                <button class="close-btn" onclick="cerrarModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <form id="formRecarga">
                <div class="form-group">
                    <label for="opcionSelect">Paquete:</label>
                    <select id="opcionSelect" onchange="actualizarResumen()"></select>
                </div>

                <!-- Contenedor dinámico donde se inyectan los inputs de ID / Correo y Verificación -->
                <div id="camposIdContainer" class="form-group"></div>

                <div class="form-group">
                    <label for="metodoPagoSelect">Método de Pago:</label>
                    <select id="metodoPagoSelect" onchange="manejarMetodoPago()" required>
                        <option value="">Seleccione...</option>
                        <option value="Tarjeta de débito de Banco Pedro Carbo">Tarjeta de débito de Banco Pedro Carbo</option>
                        <option value="Transferencia Bancaria" disabled>Transferencia Bancaria (Deshabilitado)</option>
                        <option value="Persona Física" disabled>Persona Física (Deshabilitado)</option>
                    </select>
                </div>

                <div id="camposTarjetaContainer"></div>

                <div class="resumen-pago">
                    <div><span>Subtotal:</span> <span id="lblPrecio">$0.00</span></div>
                    <div><span>Comisión:</span> <span id="lblComision">$0.00</span></div>
                    <div class="total"><span>Total:</span> <span id="lblTotal">$0.00</span></div>
                </div>

                <button type="submit" id="btnSubmitForm" class="btn-comprar">Proceder al Pago</button>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 PC Recarga</p>
    </footer>

    <!-- Script conectado -->
    <script type="module" src="script_6.js"></script>
    <script>
        // Script simple local para los filtros de las tarjetas
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const filter = btn.getAttribute('data-filter');
                document.querySelectorAll('.card').forEach(card => {
                    if (filter === 'all' || card.getAttribute('data-category') === filter) {
                        card.style.display = 'flex';
                    } else {
                        card.style.display = 'none';
                    }
                });
            });
        });
    </script>
</body>
</html>
