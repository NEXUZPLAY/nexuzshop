<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tragamonedas y Canjes - Nexus Gaming</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .main-wrapper {
            max-width: 950px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
        }
        @media (min-width: 768px) {
            .main-wrapper {
                display: grid;
                grid-template-columns: 1fr 1fr;
                align-items: start;
            }
            .full-width {
                grid-column: 1 / -1;
            }
        }
        .container {
            background: #1e293b;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
            width: 100%;
            border: 2px solid #334155;
            box-sizing: border-box;
        }
        @media (min-width: 768px) {
            .container { padding: 30px; }
        }
        h1, h2 {
            color: #38bdf8;
            margin-bottom: 10px;
        }
        .slot-machine {
            background: #090d16;
            border: 4px solid #f59e0b;
            border-radius: 12px;
            padding: 15px;
            margin: 15px 0;
            display: flex;
            justify-content: center;
            gap: 8px;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
        }
        .reel {
            width: 80px;
            height: 85px;
            background: #ffffff;
            color: #0f172a;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 2px solid #cbd5e1;
            text-align: center;
            padding: 4px;
        }
        @media (min-width: 768px) {
            .reel { width: 100px; height: 90px; font-size: 1rem; }
        }
        .reel-inner {
            display: flex;
            flex-direction: column;
        }
        .reel-item {
            height: 85px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @media (min-width: 768px) {
            .reel-item { height: 90px; }
        }
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            box-sizing: border-box;
        }
        .btn-google {
            background: #ffffff;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-google:hover { background: #f1f5f9; }
        .btn-girar {
            background: #f59e0b;
            color: #000;
        }
        .btn-girar:hover { background: #d97706; }
        .btn-girar:disabled { background: #64748b; cursor: not-allowed; }
        .info-puntos {
            font-size: 1.2rem;
            margin: 15px 0;
            color: #fbbf24;
        }
        .canje-card {
            background: #0f172a;
            border: 1px solid #334155;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            text-align: left;
        }
        @media (min-width: 768px) {
            .canje-card {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <div class="main-wrapper">
        <!-- ZONA DE USUARIO -->
        <div class="container">
            <h1>🔐 Zona de Usuarios</h1>
            <p style="color: #94a3b8; font-size: 0.9rem;">Inicia sesión con Google para verificar tus puntos y jugar.</p>

            <div id="loginSection">
                <button class="btn-google" onclick="iniciarSesionGoogle()">
                    <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.82 2.71v2.26h2.94c1.72-1.58 2.78-3.9 2.78-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.94-2.26c-.81.54-1.84.86-3.02.86-2.34 0-4.32-1.58-5.03-3.71H.95v2.33C2.43 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.21c-.19-.54-.3-1.12-.3-1.71s.11-1.17.3-1.71V4.46H.95C.34 5.68 0 7.07 0 8.5s.34 2.82.95 4.04l3.02-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.43 2.02.95 4.46l3.02 2.33c.71-2.13 2.69-3.71 5.03-3.71z"/></svg>
                    Iniciar Sesión con Google
                </button>
            </div>

            <div id="juegoSection" style="display: none;">
                <p id="userEmailDisplay" style="color: #38bdf8; font-size: 0.9rem; margin-bottom: 5px; word-break: break-all;"></p>
                <div class="info-puntos">Tus Puntos: <span id="puntosDisponibles">0</span> pts</div>
                <button onclick="cerrarSesionGoogle()" style="background: #334155; color: #fff; margin-top: 10px;">Cerrar Sesión</button>
            </div>
        </div>

        <!-- TRAGAMONEDAS -->
        <div class="container">
            <h2 style="font-size: 1.2rem;">🎰 Tragamonedas (50 pts)</h2>
            <div class="slot-machine">
                <div class="reel" id="reel1"><div class="reel-inner"><div class="reel-item">❓</div></div></div>
                <div class="reel" id="reel2"><div class="reel-inner"><div class="reel-item">❓</div></div></div>
                <div class="reel" id="reel3"><div class="reel-inner"><div class="reel-item">❓</div></div></div>
            </div>

            <button class="btn-girar" id="btnGirar" onclick="girarTragamonedas()" disabled>¡Girar Tragamonedas!</button>
            <p id="mensajeResultado" style="margin-top: 10px; font-weight: bold; min-height: 20px;"></p>
        </div>

        <!-- SECCIÓN DE CANJES DISPONIBLES -->
        <div class="container full-width" id="seccionCanjes" style="display: none;">
            <h2>🎁 Canjear Puntos por Premios</h2>
            <p style="color: #94a3b8; font-size: 0.85rem;">Selecciona un premio del catálogo:</p>
            <div id="listaCanjesDisponibles">Cargando premios...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, updateDoc, collection, getDocs, addDoc, query, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const miFirebaseConfig = {
            apiKey: "AIzaSyCOzTgyw5GqN9OeGvot45rqXAcjs5w848M",
            authDomain: "pc-recarga-77d05.firebaseapp.com",
            projectId: "pc-recarga-77d05",
            storageBucket: "pc-recarga-77d05.firebasestorage.app",
            messagingSenderId: "381158278092",
            appId: "1:381158278092:web:a4abad0bae8ad046e11369",
            measurementId: "G-3G3GLFY81L"
        };

        const app = initializeApp(miFirebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let usuarioActualEmail = "";
        let puntosActuales = 0;

        window.iniciarSesionGoogle = async function() {
            try { await signInWithPopup(auth, provider); } catch (e) { alert("Error al iniciar sesión."); }
        }

        window.cerrarSesionGoogle = async function() { await signOut(auth); }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                usuarioActualEmail = user.email;
                document.getElementById('userEmailDisplay').textContent = usuarioActualEmail;
                document.getElementById('loginSection').style.display = 'none';
                document.getElementById('juegoSection').style.display = 'block';
                document.getElementById('seccionCanjes').style.display = 'block';
                document.getElementById('btnGirar').disabled = false;
                await sincronizarPuntos();
                cargarCatalogoCanjes();
            } else {
                usuarioActualEmail = "";
                document.getElementById('loginSection').style.display = 'block';
                document.getElementById('juegoSection').style.display = 'none';
                document.getElementById('seccionCanjes').style.display = 'none';
                document.getElementById('btnGirar').disabled = true;
            }
        });

        async function sincronizarPuntos() {
            try {
                const userRef = doc(db, "usuarios_tienda", usuarioActualEmail);
                const userSnap = await getDoc(userRef);
                puntosActuales = userSnap.exists() ? (userSnap.data().puntos || 0) : 0;
                document.getElementById('puntosDisponibles').textContent = puntosActuales;
            } catch (e) { console.error(e); }
        }

        window.girarTragamonedas = async function() {
            if (puntosActuales < 50) { alert("No tienes suficientes puntos."); return; }
            const btnGirar = document.getElementById('btnGirar');
            btnGirar.disabled = true;
            document.getElementById('mensajeResultado').textContent = "Girando...";

            puntosActuales -= 50;
            const userRef = doc(db, "usuarios_tienda", usuarioActualEmail);
            await updateDoc(userRef, { puntos: puntosActuales });
            document.getElementById('puntosDisponibles').textContent = puntosActuales;

            let resultadoFinal = elegirPremioConBajaProbabilidad();
            animarRodillo('reel1', resultadoFinal.nombre);
            animarRodillo('reel2', resultadoFinal.nombre);
            animarRodillo('reel3', resultadoFinal.nombre);

            setTimeout(async () => {
                btnGirar.disabled = false;
                if (resultadoFinal.valor > 0) {
                    document.getElementById('mensajeResultado').innerHTML = `🎉 ¡Ganaste: ${resultadoFinal.nombre}!`;
                    if (resultadoFinal.tipo === "puntos") {
                        puntosActuales += resultadoFinal.valor;
                        await updateDoc(userRef, { puntos: puntosActuales });
                        document.getElementById('puntosDisponibles').textContent = puntosActuales;
                    }
                } else {
                    document.getElementById('mensajeResultado').textContent = "😢 ¡Sigue intentando!";
                }
            }, 2100);
        }

        function elegirPremioConBajaProbabilidad() {
            const rand = Math.random() * 100;
            if (rand < 50) return { nombre: "Inténtalo de nuevo", valor: 0, tipo: "nada" };
            if (rand < 75) return { nombre: "50 Puntos", valor: 50, tipo: "puntos" };
            if (rand < 90) return { nombre: "100 Puntos", valor: 100, tipo: "puntos" };
            if (rand < 95) return { nombre: "110 Diamantes", valor: 110, tipo: "premio" };
            if (rand < 99.9) return { nombre: "500 Diamantes", valor: 500, tipo: "premio" };
            return { nombre: "5,600 Diamantes 💎", valor: 5600, tipo: "premio_mayor" };
        }

        function animarRodillo(reelId, resultadoFinalTexto) {
            const reel = document.getElementById(reelId).querySelector('.reel-inner');
            let htmlItems = '';
            for (let i = 0; i < 15; i++) { htmlItems += `<div class="reel-item">🎲</div>`; }
            htmlItems += `<div class="reel-item" style="color: #22c55e; font-weight: bold;">${resultadoFinalTexto}</div>`;
            reel.innerHTML = htmlItems;
            reel.style.transition = 'transform 2s linear';
            reel.style.transform = `translateY(-${15 * 90}px)`;

            setTimeout(() => {
                reel.style.transition = 'none';
                reel.innerHTML = `<div class="reel-item" style="color: #22c55e; font-weight: bold;">${resultadoFinalTexto}</div>`;
                reel.style.transform = 'translateY(0)';
            }, 2100);
        }

        async function cargarCatalogoCanjes() {
            const contenedor = document.getElementById('listaCanjesDisponibles');
            try {
                const snapshot = await getDocs(collection(db, "catalogo_canjes"));
                contenedor.innerHTML = "";
                if (snapshot.empty) { contenedor.innerHTML = "<p style='color: #94a3b8;'>No hay premios.</p>"; return; }
                snapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    let esPromoNuevo = (data.nombre.toLowerCase().includes("110") || data.nombre.toLowerCase().includes("diamante")) && Number(data.costo) === 500;
                    
                    contenedor.innerHTML += `
                        <div class="canje-card">
                            <div>
                                <b>${data.nombre}</b><br>
                                <span style="color: #fbbf24; font-size: 0.9rem;">Costo: ${data.costo} Puntos</span>
                                ${esPromoNuevo ? '<br><span style="color: #38bdf8; font-size: 0.75rem;">(Exclusivo para Nuevos Usuarios - Requiere ID de FF)</span>' : ''}
                            </div>
                            <div>
                                ${esPromoNuevo ? '<input type="text" id="inputIdFreeFire" placeholder="Ingresa tu ID de Free Fire" style="margin-bottom: 5px;">' : ''}
                                <button onclick="canjearPremio('${data.nombre}', ${data.costo}, ${esPromoNuevo})" style="background: #38bdf8; color: #000; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%;">Canjear</button>
                            </div>
                        </div>
                    `;
                });
            } catch (e) { console.error(e); }
        }

        window.canjearPremio = async function(nombrePremio, costo, esPromoNuevo) {
            if (puntosActuales < costo) { alert("Puntos insuficientes."); return; }

            let idFreeFire = "";
            if (esPromoNuevo) {
                const inputElem = document.getElementById('inputIdFreeFire');
                idFreeFire = inputElem ? inputElem.value.trim() : "";
                if (!idFreeFire) {
                    alert("Por favor, ingresa tu ID de Free Fire para reclamar este premio exclusivo.");
                    return;
                }

                // VALIDACIÓN ANTIFRAUDE: Buscar en Firestore si este ID de Free Fire ya fue usado en otra solicitud de canje previa
                try {
                    const q = query(collection(db, "solicitudes_canje"), where("idFreeFire", "==", idFreeFire));
                    const querySnapshot = await getDocs(q);
                    if (!querySnapshot.empty) {
                        alert("❌ Ya reclamaste este premio en tu otra cuenta o con este mismo ID de Free Fire. Está prohibido el fraude.");
                        return;
                    }
                } catch (e) {
                    console.error("Error al validar fraude:", e);
                    alert("Error al verificar el ID de Free Fire. Inténtalo de nuevo.");
                    return;
                }
            }

            if (confirm(`¿Canjear "${nombrePremio}" por ${costo} puntos?`)) {
                try {
                    puntosActuales -= costo;
                    const userRef = doc(db, "usuarios_tienda", usuarioActualEmail);
                    await updateDoc(userRef, { puntos: puntosActuales });
                    document.getElementById('puntosDisponibles').textContent = puntosActuales;

                    // Guardamos la solicitud incluyendo el ID de Free Fire para el control antifraude futuro
                    await addDoc(collection(db, "solicitudes_canje"), {
                        email: usuarioActualEmail, 
                        premio: nombrePremio, 
                        costoPuntos: costo,
                        idFreeFire: idFreeFire || "N/A",
                        fecha: new Date().toLocaleString(), 
                        timestamp: serverTimestamp(), 
                        estado: "Pendiente"
                    });
                    
                    alert("¡Canje solicitado con éxito!");
                    cargarCatalogoCanjes(); // Recargar para limpiar campos
                } catch (e) { 
                    alert("Error al procesar el canje."); 
                }
            }
        }
    </script>
</body>
</html>
