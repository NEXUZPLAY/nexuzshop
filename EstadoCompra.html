<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estado de Mis Compras - Nexus Gaming</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0b0f19; color: #fff; margin: 0; padding: 15px; box-sizing: border-box; }
        .container { max-width: 800px; margin: 0 auto; padding-bottom: 30px; }
        h2 { color: #38bdf8; text-align: center; margin-bottom: 25px; }
        
        /* Tarjeta de Pedido */
        .order-card { background: #131b2e; border: 1px solid #1e293b; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 8px 20px rgba(0,0,0,0.4); }
        .order-header { background: #0f172a; padding: 12px 15px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; border: 1px solid #334155; }
        
        /* Barra de Progreso de Pasos */
        .progress-container { display: flex; justify-content: space-between; align-items: center; position: relative; margin: 30px 10px 40px; }
        .progress-container::before { content: ''; position: absolute; width: 100%; height: 4px; background: #334155; top: 15px; z-index: 1; left: 0; }
        .progress-line-active { position: absolute; height: 4px; background: #f97316; top: 15px; z-index: 2; transition: width 0.4s ease; left: 0; }
        
        .step-item { position: relative; z-index: 3; text-align: center; display: flex; flex-direction: column; align-items: center; }
        .step-circle { width: 34px; height: 34px; border-radius: 50%; background: #1e293b; border: 3px solid #334155; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 0.9rem; transition: 0.3s; }
        .step-circle.active { background: #f97316; border-color: #f97316; color: #fff; box-shadow: 0 0 10px rgba(249, 115, 22, 0.5); }
        .step-label { font-size: 0.75rem; color: #94a3b8; margin-top: 8px; font-weight: 600; }
        .step-label.active { color: #f97316; }

        /* Detalles del Producto */
        .order-details { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 15px; margin-bottom: 15px; }
        .order-total { font-size: 1.2rem; font-weight: bold; color: #fbbf24; }
        .order-subinfo { font-size: 0.85rem; color: #94a3b8; margin-bottom: 15px; }

        /* Botones de Acción */
        .btn-action { display: block; width: 100%; background: #1e293b; color: #fff; border: 1px solid #334155; padding: 12px; border-radius: 8px; text-align: center; text-decoration: none; font-weight: bold; margin-bottom: 10px; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .btn-action:hover { background: #334155; }
        .btn-primary-gradient { background: linear-gradient(135deg, #f97316, #ea580c); border: none; color: #fff; }
        .btn-primary-gradient:hover { opacity: 0.9; background: linear-gradient(135deg, #f97316, #ea580c); }

        /* Modal de Factura Estilo Ticket */
        .modal-factura { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .factura-box { background: #0f172a; border: 2px solid #38bdf8; border-radius: 12px; width: 100%; max-width: 450px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); position: relative; }
        .factura-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px dashed #334155; padding-bottom: 12px; margin-bottom: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>📦 Estado de Mis Compras</h2>
        
        <div id="listaMisPedidos">
            <p style="color: #94a3b8; text-align: center;">Cargando tus compras en tiempo real...</p>
        </div>
    </div>

    <!-- MODAL DE FACTURA DIGITAL -->
    <div id="modalFactura" class="modal-factura">
        <div class="factura-box" id="contenidoFacturaTicket">
            <!-- Se llena dinámicamente -->
        </div>
    </div>

    <script type="module" src="EstadoCompra.js"></script>
</body>
</html>
