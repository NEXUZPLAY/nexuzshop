<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Compras - Nexus Gaming</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #fff; margin: 0; padding: 15px; box-sizing: border-box; }
        .container { max-width: 1000px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; border: 1px solid #334155; }
        h2 { color: #38bdf8; text-align: center; margin-bottom: 20px; }
        
        .grid-transacciones { display: grid; grid-template-columns: 1fr; gap: 15px; }
        @media (min-width: 768px) { .grid-transacciones { grid-template-columns: repeat(2, 1fr); } }

        .card-tx { background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 15px; display: flex; flex-direction: column; gap: 8px; }
        .card-tx b { color: #38bdf8; }
        .comprobante-img { max-width: 100%; height: 180px; object-fit: cover; border-radius: 6px; border: 1px solid #475569; cursor: pointer; margin-top: 5px; }
        
        .acciones-btns { display: flex; gap: 10px; margin-top: 10px; }
        .btn-aceptar { background: #22c55e; color: #fff; flex: 1; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-aceptar:hover { background: #16a34a; }
        .btn-rechazar { background: #ef4444; color: #fff; flex: 1; border: none; padding: 8px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-rechazar:hover { background: #dc2626; }
        
        .badge-estado { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; display: inline-block; }
        .badge-pendiente { background: #fbbf24; color: #000; }
        .badge-verificacion { background: #38bdf8; color: #000; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🔍 Panel de Verificación de Pagos y Transferencias</h2>
        <p style="color: #94a3b8; font-size: 0.88rem; text-align: center; margin-bottom: 20px;">Revisa los comprobantes enviados por los clientes y aprueba o rechaza sus recargas.</p>

        <div id="listaTransaccionesVerificacion" class="grid-transacciones">
            <p style="color: #94a3b8; text-align: center; width: 100%;">Cargando solicitudes pendientes...</p>
        </div>
    </div>

    <script type="module" src="verificacion.js"></script>
</body>
</html>
