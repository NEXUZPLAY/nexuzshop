<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Gaming & Stream - Panel de Verificación</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #090d16;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
        }
        .admin-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }
        .admin-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .admin-header h1 {
            color: #38bdf8;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .admin-header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .tab-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn:hover { background: #334155; color: #fff; }
        .tab-btn.active {
            background: #38bdf8;
            color: #000;
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        .grid-verificacion {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .volver-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .volver-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="admin-container">
        <a href="index.html" class="volver-link"><i class="fa-solid fa-arrow-left"></i> Volver a la Tienda</a>
        
        <div class="admin-header">
            <h1><i class="fa-solid fa-shield-halved"></i> Panel de Verificación de Pagos</h1>
            <p>Monitorea los comprobantes pendientes o revisa el historial de pedidos completados.</p>
        </div>

        <!-- PANTALLA DE ACCESO RESTRINGIDO / LOGIN CON GOOGLE -->
        <div id="loginAdminBox" style="display: none; text-align: center; padding: 50px; background: #1e293b; border-radius: 12px; border: 1px solid #334155; max-width: 450px; margin: 40px auto;">
            <i class="fa-solid fa-lock" style="font-size: 3rem; color: #f59e0b; margin-bottom: 15px;"></i>
            <h3 style="color: #fff; margin-bottom: 10px;">Acceso de Administrador Requerido</h3>
            <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;">Inicia sesión con la cuenta de administrador autorizada para gestionar las transacciones.</p>
            <button onclick="loginConGoogleAdmin()" style="background: #ea4335; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; font-size: 1rem;">
                <i class="fa-brands fa-google"></i> Iniciar sesión con Google
            </button>
        </div>

        <!-- CONTENIDO DEL PANEL (Oculto hasta que se verifique el admin) -->
        <div id="panelAdminContenido" style="display: none;">
            <div class="tabs-container">
                <button id="btnTabEnVerificacion" class="tab-btn active" onclick="cambiarSeccionAdmin('enVerificacion')">
                    <i class="fa-solid fa-clock"></i> Verificación En Verificación
                </button>
                <button id="btnTabComprobada" class="tab-btn" onclick="cambiarSeccionAdmin('comprobada')">
                    <i class="fa-solid fa-circle-check"></i> Verificación Comprobada
                </button>
            </div>

            <div id="listaPedidosVerificacion" class="grid-verificacion">
                <!-- Se llena dinámicamente -->
            </div>
        </div>
    </div>

    <script type="module" src="verificacion.js"></script>
</body>
</html>
