<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Gaming & Stream - Panel de Verificación</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="logo.png">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #090d16;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            box-sizing: border-box;
        }
        .admin-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }
        .admin-header {
            text-align: center;
            margin-bottom: 25px;
        }
        .admin-header h1 {
            color: #38bdf8;
            font-size: 2rem;
            margin-bottom: 8px;
        }
        .admin-header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        /* Botones de Pestañas / Secciones */
        .tabs-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }
        .tab-btn {
            background: #1e293b;
            color: #94a3b8;
            border: 1px solid #334155;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .tab-btn:hover {
            background: #334155;
            color: #fff;
        }
        .tab-btn.active {
            background: #38bdf8;
            color: #000;
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }
        .grid-verificacion {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 20px;
        }
        .card-pedido {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .card-pedido h3 {
            margin-top: 0;
            color: #fbbf24;
            font-size: 1.1rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 10px;
        }
        .info-row {
            font-size: 0.88rem;
            color: #cbd5e1;
            margin-bottom: 8px;
        }
        .info-row b {
            color: #38bdf8;
        }
        .comprobante-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #475569;
            margin: 10px 0;
            cursor: pointer;
            transition: 0.2s;
        }
        .comprobante-img:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
        .volver-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #38bdf8;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .volver-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="admin-container">
        <a href="index.html" class="volver-link"><i class="fa-solid fa-arrow-left"></i> Volver a la Tienda</a>
        
        <div class="admin-header">
            <h1><i class="fa-solid fa-shield-halved"></i> Panel de Verificación de Pagos</h1>
            <p>Monitorea los comprobantes pendientes o revisa el historial de pedidos completados.</p>
        </div>

        <!-- BOTONES DE NAVEGACIÓN ENTRE SECCIONES -->
        <div class="tabs-container">
            <button id="btnTabEnVerificacion" class="tab-btn active" onclick="cambiarSeccionAdmin('enVerificacion')">
                <i class="fa-solid fa-clock"></i> Verificación En Verificación
            </button>
            <button id="btnTabComprobada" class="tab-btn" onclick="cambiarSeccionAdmin('comprobada')">
                <i class="fa-solid fa-circle-check"></i> Verificación Comprobada
            </button>
        </div>

        <!-- CONTENEDOR DINÁMICO DE PEDIDOS -->
        <div id="listaPedidosVerificacion" class="grid-verificacion">
            <!-- Se llenará dinámicamente con JavaScript -->
        </div>
    </div>

    <!-- Script dedicado para la verificación -->
    <script type="module" src="verificacion.js"></script>
</body>
</html>
