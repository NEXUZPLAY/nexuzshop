<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Soporte y Chat - Nexus Gaming</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-panel: #131b2e;
            --bg-inner: #0f172a;
            --border-color: #1e293b;
            --accent: #38bdf8;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* Barra superior */
        .chat-topbar { background: var(--bg-panel); border-bottom: 1px solid var(--border-color); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        .chat-topbar h2 { color: var(--accent); font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .btn-volver { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 6px 12px; border-radius: 6px; text-decoration: none; font-size: 0.8rem; font-weight: bold; }

        /* Contenedor Principal (Admin vs Cliente) */
        .chat-layout { display: flex; flex: 1; height: calc(100vh - 55px); overflow: hidden; }

        /* Panel Lateral para Admin (Lista de Clientes) */
        .admin-sidebar { width: 320px; background: var(--bg-panel); border-right: 1px solid var(--border-color); display: none; flex-direction: column; }
        .admin-sidebar-header { padding: 15px; border-bottom: 1px solid var(--border-color); font-size: 0.85rem; font-weight: bold; color: var(--accent); }
        .lista-conversaciones { flex: 1; overflow-y: auto; }
        .conv-item { padding: 14px 15px; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; }
        .conv-item:hover, .conv-item.active { background: var(--bg-inner); border-left: 4px solid var(--accent); }

        /* Área de Chat Principal */
        .chat-main-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); height: 100%; }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }

        /* Burbujas de Mensajes */
        .chat-msg { max-width: 80%; padding: 10px 14px; border-radius: 10px; font-size: 0.88rem; line-height: 1.4; word-break: break-word; }
        .chat-msg.user { background: #1e293b; color: #fff; align-self: flex-end; border: 1px solid #334155; }
        .chat-msg.system { background: #0f172a; color: #38bdf8; align-self: flex-start; border: 1px solid #334155; width: 100%; max-width: 100%; }
        .chat-msg.admin { background: linear-gradient(135deg, #f97316, #ea580c); color: #fff; align-self: flex-start; }

        /* Barra de Entrada de Mensajes y Comprobantes */
        .chat-input-bar { background: var(--bg-panel); border-top: 1px solid var(--border-color); padding: 12px 15px; display: flex; align-items: center; gap: 10px; }
        .chat-input-bar input[type="text"] { flex: 1; background: var(--bg-inner); border: 1px solid #334155; padding: 10px 14px; border-radius: 8px; color: #fff; font-size: 0.9rem; outline: none; }
        .btn-enviar { background: #38bdf8; color: #000; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-adjuntar { background: #1e293b; color: #38bdf8; border: 1px solid #334155; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }

        /* Vista exclusiva para móviles Android */
        @media (max-width: 768px) {
            .admin-sidebar { width: 100%; }
            .admin-sidebar.oculto-movil { display: none !important; }
            .chat-main-area.oculto-movil { display: none !important; }
        }
    </style>
</head>
<body>

    <div class="chat-topbar">
        <h2><i class="fa-solid fa-headset"></i> Soporte y Comprobantes</h2>
        <a href="index.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver a la Tienda</a>
    </div>

    <div class="chat-layout">
        <!-- Panel lateral de clientes (Solo visible para el Admin) -->
        <div id="adminSidebar" class="admin-sidebar">
            <div class="admin-sidebar-header"><i class="fa-solid fa-users"></i> Clientes con Solicitudes</div>
            <div id="listaConversacionesAdmin" class="lista-conversaciones">
                <!-- Se llena dinámicamente -->
            </div>
        </div>

        <!-- Área de mensajes -->
        <div id="chatMainArea" class="chat-main-area">
            <div id="chatContainer" class="chat-messages">
                <div class="chat-msg system">Cargando historial de mensajes...</div>
            </div>

            <div class="chat-input-bar">
                <label class="btn-adjuntar" title="Subir Comprobante">
                    <i class="fa-solid fa-image"></i>
                    <input type="file" id="inputFotoComprobante" accept="image/*" style="display: none;" onchange="subirComprobanteChat(event)">
                </label>
                <input type="text" id="msgUsuarioInput" placeholder="Escribe un mensaje o sube tu comprobante..." onkeypress="if(event.key === 'Enter') enviarMensajeChat()">
                <button class="btn-enviar" onclick="enviarMensajeChat()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script type="module" src="chat.js"></script>
</body>
</html>
