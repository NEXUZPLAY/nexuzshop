<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat de Soporte y Comprobantes - PC Recarga</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #0b0f19;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. PANTALLA DE LOGIN OBLIGATORIA (Si no hay sesión activa) -->
        <div id="contenedorLoginChat" style="display: none; margin-top: 50px; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            <h3 style="color: #38bdf8; margin-top: 0; font-size: 1.4rem;"><i class="fa-solid fa-lock"></i> Acceso Restringido</h3>
            <p style="font-size: 0.9rem; color: #94a3b8; margin-bottom: 25px;">Para ver el chat de soporte y enviar tu comprobante de transferencia, debes iniciar sesión:</p>
            
            <!-- Botón Google -->
            <button onclick="loginConGoogleChat()" style="width: 100%; background: #ffffff; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 0.95rem; transition: 0.2s;">
                <i class="fa-brands fa-google" style="color: #ea4335; font-size: 1.1rem;"></i> Continuar con Google
            </button>

            <div style="margin: 20px 0; color: #64748b; font-size: 0.85rem; position: relative;">
                <span style="background: #1e293b; padding: 0 10px; position: relative; z-index: 2;">O ingresa con correo y contraseña</span>
                <div style="position: absolute; top: 50%; left: 0; width: 100%; height: 1px; background: #334155; z-index: 1;"></div>
            </div>

            <!-- Formulario Correo / Contraseña -->
            <form onsubmit="loginConEmailChat(event)">
                <input type="email" id="chatLoginEmail" placeholder="Correo electrónico" required style="width: 100%; padding: 12px; margin-bottom: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box; font-size: 0.9rem;">
                <input type="password" id="chatLoginPassword" placeholder="Contraseña" required style="width: 100%; padding: 12px; margin-bottom: 20px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; box-sizing: border-box; font-size: 0.9rem;">
                <button type="submit" style="width: 100%; background: #38bdf8; color: #000; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.95rem;">Iniciar Sesión</button>
            </form>

            <div style="margin-top: 20px;">
                <a href="index.html" style="color: #94a3b8; text-decoration: none; font-size: 0.85rem;"><i class="fa-solid fa-arrow-left"></i> Volver a la tienda principal</a>
            </div>
        </div>

        <!-- 2. INTERFAZ DEL CHAT ACTIVO (Visible solo cuando el usuario está logueado) -->
        <div id="contenedorChatActivo" style="display: none; background: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
            
            <!-- Cabecera del Chat -->
            <div style="background: #0f172a; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155;">
                <div>
                    <b style="color: #38bdf8; font-size: 1rem;"><i class="fa-solid fa-headset"></i> Soporte y Validación de Comprobantes</b><br>
                    <span style="font-size: 0.78rem; color: #94a3b8;" id="emailUsuarioChatActivo">Cargando cuenta...</span>
                </div>
                <div style="display: flex; gap: 10px; align-items: center;">
                    <a href="index.html" style="background: #334155; color: #fff; padding: 7px 12px; border-radius: 6px; text-decoration: none; font-size: 0.8rem; font-weight: bold;">Tienda</a>
                    <button onclick="cerrarSesionChat()" style="background: #ef4444; color: #fff; border: none; padding: 7px 12px; border-radius: 6px; font-size: 0.8rem; font-weight: bold; cursor: pointer;">Cerrar Sesión</button>
                </div>
            </div>

            <!-- Cuerpo de Mensajes en Tiempo Real -->
            <div id="chatContainer" style="padding: 20px; height: 380px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #131b2e;">
                <!-- Los mensajes de Firestore se cargan aquí automáticamente -->
            </div>

            <!-- Alerta visual de subida de imagen -->
            <div id="statusSubidaFoto" style="display: none; padding: 10px; text-align: center; font-size: 0.85rem; color: #fbbf24; background: #0f172a; border-top: 1px solid #334155;">
                ⏳ Subiendo imagen a Cloudinary, por favor espera...
            </div>

            <!-- Barra inferior para escribir mensajes y adjuntar fotos -->
            <div style="padding: 15px; background: #0f172a; border-top: 1px solid #334155; display: flex; gap: 10px; align-items: center;">
                <label style="background: #334155; color: #fff; padding: 10px 14px; border-radius: 8px; cursor: pointer; font-size: 1rem; transition: 0.2s;" title="Subir Comprobante">
                    <i class="fa-solid fa-image"></i>
                    <input type="file" accept="image/*" onchange="subirComprobanteChat(event)" style="display: none;">
                </label>
                <input type="text" id="msgUsuarioInput" placeholder="Escribe un mensaje o detalla tu transferencia..." style="flex: 1; padding: 11px 14px; background: #1e293b; border: 1px solid #475569; border-radius: 8px; color: #fff; font-size: 0.9rem; outline: none;" onkeypress="if(event.key === 'Enter') enviarMensajeSoporteChat()">
                <button onclick="enviarMensajeSoporteChat()" style="background: #38bdf8; color: #000; border: none; padding: 11px 18px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Enlace al script del chat como módulo -->
    <script type="module" src="chat.js"></script>
</body>
</html>
