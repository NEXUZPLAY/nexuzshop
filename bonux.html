<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bonus de Recarga Acumulada - Nexus Gaming</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 2px solid #334155;
            box-sizing: border-box;
        }
        h1, h2 {
            color: #38bdf8;
            text-align: center;
        }
        .btn {
            background: #38bdf8;
            color: #000;
            font-weight: bold;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            width: 100%;
            margin-top: 10px;
            transition: 0.2s;
        }
        .btn:hover { background: #0ea5e9; }
        .btn:disabled {
            background: #475569;
            color: #94a3b8;
            cursor: not-allowed;
        }
        .btn-google {
            background: #ffffff;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 15px auto;
            max-width: 300px;
            width: 100%;
        }
        .progress-container {
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }
        .milestones-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 15px;
        }
        .milestone-card {
            background: #1e293b;
            border: 2px solid #475569;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
        }
        .milestone-card.unlocked {
            border-color: #22c55e;
            background: #064e3b;
        }
        .milestone-card.claimed {
            border-color: #64748b;
            background: #0f172a;
            opacity: 0.6;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            box-sizing: border-box;
            margin-bottom: 10px;
            font-size: 1rem;
        }
        .info-box {
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #334155;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .player-info {
            background: #0f172a;
            border: 1px solid #22c55e;
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 15px;
            font-size: 0.95rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔥 Bonus Acumulado Free Fire</h1>
        
        <!-- PANTALLA DE ACCESO -->
        <div id="authScreen" style="text-align: center;">
            <p style="color: #94a3b8;">Inicia sesión con tu cuenta para ver tu progreso de recarga acumulada.</p>
            <button class="btn btn-google" onclick="iniciarSesion()">
                <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84c-.21 1.12-.86 2.07-1.82 2.71v2.26h2.94c1.72-1.58 2.78-3.9 2.78-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.94-2.26c-.81.54-1.84.86-3.02.86-2.34 0-4.32-1.58-5.03-3.71H.95v2.33C2.43 15.98 5.48 18 9 18z"/><path fill="#FBBC05" d="M3.97 10.21c-.19-.54-.3-1.12-.3-1.71s.11-1.17.3-1.71V4.46H.95C.34 5.68 0 7.07 0 8.5s.34 2.82.95 4.04l3.02-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0 5.48 0 2.43 2.02.95 4.46l3.02 2.33c.71-2.13 2.69-3.71 5.03-3.71z"/></svg>
                Iniciar Sesión con Google
            </button>
        </div>

        <!-- CONTENIDO PRINCIPAL -->
        <div id="mainContent" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <span id="userEmailText" style="color: #38bdf8; font-size: 0.85rem;"></span>
                <button onclick="cerrarSesion()" style="background: #ef4444; color: #fff; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">Salir</button>
            </div>

            <div class="info-box">
                <div>
                    <p style="margin: 0 0 3px 0; color: #94a3b8; font-size: 0.85rem;">Tus Diamantes Acumulados:</p>
                    <span id="puntosDisponibles" style="font-size: 1.4rem; color: #fbbf24; font-weight: bold;">0 💎</span>
                </div>
            </div>

            <!-- BARRA DE PROGRESO / METAS ACUMULADAS -->
            <div class="progress-container">
                <p style="margin: 0 0 10px 0; color: #38bdf8; font-weight: bold; font-size: 0.95rem;">Metas de Bonus Acumulado</p>
                <div class="milestones-grid">
                    <div class="milestone-card" id="meta100">
                        <span style="font-size: 0.8rem; color: #94a3b8;">Meta 100 💎</span>
                        <h4 style="margin: 5px 0; color: #fff;">+100 Bonus</h4>
                        <span id="estadoMeta100" style="font-size: 0.75rem; color: #cbd5e1;">Bloqueado 🔒</span>
                    </div>
                    <div class="milestone-card" id="meta300">
                        <span style="font-size: 0.8rem; color: #94a3b8;">Meta 300 💎</span>
                        <h4 style="margin: 5px 0; color: #fff;">+100 Bonus</h4>
                        <span id="estadoMeta300" style="font-size: 0.75rem; color: #cbd5e1;">Bloqueado 🔒</span>
                    </div>
                    <div class="milestone-card" id="meta500">
                        <span style="font-size: 0.8rem; color: #94a3b8;">Meta 500 💎</span>
                        <h4 style="margin: 5px 0; color: #fff;">+100 Bonus</h4>
                        <span id="estadoMeta500" style="font-size: 0.75rem; color: #cbd5e1;">Bloqueado 🔒</span>
                    </div>
                </div>
            </div>

            <!-- SI YA TIENE ID Y APODO GUARDADO, SE MUESTRA ESTO -->
            <div id="playerInfoBox" class="player-info" style="display: none;">
                <div>
                    <span style="color: #94a3b8; font-size: 0.85rem;">Cuenta vinculada:</span><br>
                    <strong id="playerNameText" style="color: #fff; font-size: 1.1rem;"></strong> 
                    <span id="playerIdText" style="color: #94a3b8; font-size: 0.85rem; margin-left: 5px;"></span>
                </div>
                <span style="color: #22c55e; font-weight: bold; font-size: 0.9rem;">Verificado ✔️</span>
            </div>

            <!-- SI NO TIENE ID GUARDADO, SE MUESTRA EL CAMPO PARA ESCRIBIRLO -->
            <div id="inputSection" style="display: none;">
                <label style="color: #cbd5e1; font-size: 0.9rem;">Ingresa tu ID de Free Fire:</label>
                <div style="display: flex; gap: 8px; margin-bottom: 8px;">
                    <input type="text" id="idFreeFire" placeholder="Ej: 7408649082" style="margin-bottom: 0;">
                    <button type="button" onclick="buscarIdEnTienda()" style="background: #38bdf8; color: #000; border: none; padding: 0 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.85rem;">Verificar</button>
                </div>
                <div id="dynamicPlayerBox" style="color: #38bdf8; font-size: 0.9rem; margin-bottom: 10px; font-weight: bold;"></div>
            </div>

            <button class="btn" id="btnReclamar" onclick="reclamarBonusAcumulado()" disabled>Reclamar Bonus Disponibles</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const miFirebaseConfig = {
            apiKey: "AIzaSyCOzTgyw5GqN9OeGvot45rqXAcjs5w848M",
            authDomain: "pc-recarga-77d05.firebaseapp.com",
            projectId: "pc-recarga-77d05",
            storageBucket: "pc-recarga-77d05.firebasestorage.app",
            messagingSenderId: "381158278092",
            appId: "1:381158278092:web:a4abad0bae8ad046e11369",
            measurementId: "G-3G3GLFY81L"
        };

        const app = initializeApp(miFirebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let usuarioActualEmail = "";
        let datosUsuario = { puntos: 0, idFreeFire: "", apodoFreeFire: "", reclamados: { meta100: false, meta300: false, meta500: false } };
        let apodoVerificadoDinamico = "";
        let idVerificadoDinamico = "";

        window.iniciarSesion = async function() {
            try { await signInWithPopup(auth, provider); } catch (e) { alert("Error al iniciar sesión."); }
        }

        window.cerrarSesion = async function() { await signOut(auth); }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                usuarioActualEmail = user.email;
                document.getElementById('userEmailText').textContent = user.email;
                document.getElementById('authScreen').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';
                await sincronizarDatos();
            } else {
                usuarioActualEmail = "";
                document.getElementById('authScreen').style.display = 'block';
                document.getElementById('mainContent').style.display = 'none';
            }
        });

        async function sincronizarDatos() {
            try {
                const userRef = doc(db, "usuarios_tienda", usuarioActualEmail);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    datosUsuario.puntos = data.puntos || 0;
                    datosUsuario.idFreeFire = data.idFreeFire || "";
                    datosUsuario.apodoFreeFire = data.apodoFreeFire || "";
                    datosUsuario.reclamados = data.reclamados || { meta100: false, meta300: false, meta500: false };
                } else {
                    datosUsuario = { puntos: 0, idFreeFire: "", apodoFreeFire: "", reclamados: { meta100: false, meta300: false, meta500: false } };
                }
                actualizarInterfazVisual();
            } catch (e) { console.error(e); }
        }

        function actualizarInterfazVisual() {
            document.getElementById('puntosDisponibles').textContent = `${datosUsuario.puntos} 💎`;

            let puedeReclamarAlgo = false;

            // Meta 100
            const card100 = document.getElementById('meta100');
            const txt100 = document.getElementById('estadoMeta100');
            if (datosUsuario.reclamados.meta100) {
                card100.className = "milestone-card claimed";
                txt100.textContent = "Reclamado ✔️";
            } else if (datosUsuario.puntos >= 100) {
                card100.className = "milestone-card unlocked";
                txt100.textContent = "¡Disponible! ✅";
                puedeReclamarAlgo = true;
            } else {
                card100.className = "milestone-card";
                txt100.textContent = `Faltan ${100 - datosUsuario.puntos} 💎`;
            }

            // Meta 300
            const card300 = document.getElementById('meta300');
            const txt300 = document.getElementById('estadoMeta300');
            if (datosUsuario.reclamados.meta300) {
                card300.className = "milestone-card claimed";
                txt300.textContent = "Reclamado ✔️";
            } else if (datosUsuario.puntos >= 300) {
                card300.className = "milestone-card unlocked";
                txt300.textContent = "¡Disponible! ✅";
                puedeReclamarAlgo = true;
            } else {
                card300.className = "milestone-card";
                txt300.textContent = `Faltan ${Math.max(0, 300 - datosUsuario.puntos)} 💎`;
            }

            // Meta 500
            const card500 = document.getElementById('meta500');
            const txt500 = document.getElementById('estadoMeta500');
            if (datosUsuario.reclamados.meta500) {
                card500.className = "milestone-card claimed";
                txt500.textContent = "Reclamado ✔️";
            } else if (datosUsuario.puntos >= 500) {
                card500.className = "milestone-card unlocked";
                txt500.textContent = "¡Disponible! ✅";
                puedeReclamarAlgo = true;
            } else {
                card500.className = "milestone-card";
                txt500.textContent = `Faltan ${Math.max(0, 500 - datosUsuario.puntos)} 💎`;
            }

            // Validar si el usuario ya tiene ID guardado o si debe ingresarlo
            const playerInfoBox = document.getElementById('playerInfoBox');
            const inputSection = document.getElementById('inputSection');

            if (datosUsuario.idFreeFire && datosUsuario.apodoFreeFire) {
                document.getElementById('playerNameText').textContent = datosUsuario.apodoFreeFire;
                document.getElementById('playerIdText').textContent = `(ID: ${datosUsuario.idFreeFire})`;
                playerInfoBox.style.display = "flex";
                inputSection.style.display = "none";
                document.getElementById('btnReclamar').disabled = !puedeReclamarAlgo;
            } else {
                playerInfoBox.style.display = "none";
                inputSection.style.display = "block";
                document.getElementById('btnReclamar').disabled = !puedeReclamarAlgo || !apodoVerificadoDinamico;
            }
        }

        // Función para buscar el ID exactamente en la misma colección "jugadores_verificados" de tu tienda
        window.buscarIdEnTienda = async function() {
            const idInput = document.getElementById('idFreeFire').value.trim();
            const dynamicBox = document.getElementById('dynamicPlayerBox');

            if (!idInput) {
                dynamicBox.textContent = "Por favor ingresa un ID.";
                return;
            }

            dynamicBox.textContent = "🔍 Buscando ID...";
            try {
                const docRef = doc(db, "jugadores_verificados", idInput);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    const data = docSnap.data();
                    apodoVerificadoDinamico = data.nombreJugador;
                    idVerificadoDinamico = idInput;
                    dynamicBox.innerHTML = `✅ Apodo encontrado: <span style="color:#22c55e;">${apodoVerificadoDinamico}</span>`;
                } else {
                    apodoVerificadoDinamico = "";
                    idVerificadoDinamico = "";
                    dynamicBox.innerHTML = `❌ Este ID no ha realizado compras previas o no está verificado en la tienda. Realiza una compra primero.`;
                }
                actualizarInterfazVisual();
            } catch (e) {
                console.error(e);
                dynamicBox.textContent = "Error al buscar el ID en la base de datos.";
            }
        }

        window.reclamarBonusAcumulado = async function() {
            let idFinal = datosUsuario.idFreeFire || idVerificadoDinamico;
            let apodoFinal = datosUsuario.apodoFreeFire || apodoVerificadoDinamico;

            if (!idFinal || !apodoFinal) {
                alert("Por favor, verifica tu ID de Free Fire primero.");
                return;
            }

            let bonusTotalAReclamar = 0;
            let metasNuevas = { ...datosUsuario.reclamados };

            if (datosUsuario.puntos >= 100 && !datosUsuario.reclamados.meta100) {
                bonusTotalAReclamar += 100;
                metasNuevas.meta100 = true;
            }
            if (datosUsuario.puntos >= 300 && !datosUsuario.reclamados.meta300) {
                bonusTotalAReclamar += 100;
                metasNuevas.meta300 = true;
            }
            if (datosUsuario.puntos >= 500 && !datosUsuario.reclamados.meta500) {
                bonusTotalAReclamar += 100;
                metasNuevas.meta500 = true;
            }

            if (bonusTotalAReclamar === 0) {
                alert("No tienes bonus disponibles para reclamar en este momento.");
                return;
            }

            if (confirm(`¿Deseas reclamar ${bonusTotalAReclamar} diamantes de bonus para "${apodoFinal}" (ID: ${idFinal})?`)) {
                try {
                    datosUsuario.reclamados = metasNuevas;
                    
                    let datosAguardar = { reclamados: datosUsuario.reclamados };
                    if (!datosUsuario.idFreeFire) {
                        datosAguardar.idFreeFire = idFinal;
                        datosAguardar.apodoFreeFire = apodoFinal;
                        datosUsuario.idFreeFire = idFinal;
                        datosUsuario.apodoFreeFire = apodoFinal;
                    }

                    const userRef = doc(db, "usuarios_tienda", usuarioActualEmail);
                    await setDoc(userRef, datosAguardar, { merge: true });

                    // Registrar transacción
                    await addDoc(collection(db, "transacciones"), {
                        userEmail: usuarioActualEmail,
                        title: `Reclamo Bonus Acumulado: +${bonusTotalAReclamar} Diamantes`,
                        amount: bonusTotalAReclamar,
                        idFreeFire: idFinal,
                        apodoFreeFire: apodoFinal,
                        date: new Date().toLocaleString(),
                        timestamp: serverTimestamp()
                    });

                    actualizarInterfazVisual();
                    alert(`¡Éxito! Se han enviado ${bonusTotalAReclamar} diamantes de bonus a ${apodoFinal}.`);

                } catch (e) {
                    console.error(e);
                    alert("Ocurrió un error al procesar el reclamo.");
                }
            }
        }
    </script>
</body>
</html>
